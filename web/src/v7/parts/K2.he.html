  <figcaption class="sr-only">אנימציה. הדרך הישנה: בונים כדי להחליף תהליך. תהליך של שלושה שלבים אנושיים עובר אוטומציה שלב אחר שלב, וכל אדם מוחלף באוטומציה באותו מקום. אין יעד עסקי: התהליך המוכן רץ עד הסוף, ושואל למה? הדרך שלנו: בונים כדי להשיג יעד עסקי. קודם מופיע קו היעד של 90%. אחר כך התהליך נבנה לאחור, מהיעד אל ההתחלה: שלב של Mate, אדם שמאשר, ועוד שלב של Mate. הקו נדלק מההתחלה עד היעד, ריצה מגיעה ליעד, והיעד מסומן כמתוכנן.</figcaption>
