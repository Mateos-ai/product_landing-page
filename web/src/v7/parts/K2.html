  <figcaption class="sr-only">Animation. Old way: build to replace a flow. A flow of three human steps is automated one step at a time, each person replaced by an automation in the same place. There is no business goal: the finished flow runs to its end, and asks why? Our way: build to achieve a business goal. The goal line of 90% comes first. Then the flow is built backwards from the goal to the start: a Mate step, a person who approves, and another Mate step. The line lights up from start to goal, a run reaches the goal, and it shows On track.</figcaption>
