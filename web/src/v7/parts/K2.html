<figure class="v7-figure k2">
  <div class="v7-mock k2-stage" data-v7-mock="K2" data-v7-play="loop" data-v7-threshold=".5" data-pivot="-1.25" aria-hidden="true" inert>
    <i class="k2-probe"></i><i class="k2-ground"></i>
    <p class="k2-cap" data-act="old"><i></i>Old way: build to replace a flow.</p>
    <p class="k2-cap" data-act="new"><i></i>Our way: build to achieve a business goal.</p>
    <div class="k2-old"><i class="k2-shadow"></i><span class="k2-b" data-tone="o1" data-tower="0,0,0" data-pile="0.6,0,0" style="--w:2.5;--h:0.95;--x:0.6;--y:0;--r:0"><i class="k2-lid"></i><b class="k2-f"><span>CRM</span></b></span><span class="k2-b" data-tone="o2" data-tower="0.32,0.95,1.2" data-pile="-1.5,0.118,-8" style="--w:1.7;--h:1;--x:-1.5;--y:0.118;--r:-8"><i class="k2-lid"></i><b class="k2-f"><span>App</span></b></span><span class="k2-b" data-tone="o3" data-tower="-0.22,1.95,-1.6" data-pile="-2.45,0.646,-84" style="--w:1.3;--h:1.1;--x:-2.45;--y:0.646;--r:-84"><i class="k2-lid"></i><b class="k2-f"><span>Bot</span></b></span><span class="k2-b" data-tone="o4" data-tower="0.5,3.05,2.4" data-pile="0.42,1.055,5" style="--w:2.4;--h:0.75;--x:0.42;--y:1.055;--r:5"><i class="k2-lid"></i><b class="k2-f"><span>Excel</span></b></span><span class="k2-b" data-tone="o5" data-tower="0.02,3.8,-3.2" data-pile="-0.75,0.314,14" style="--w:2.6;--h:0.9;--x:-0.75;--y:0.314;--r:14"><i class="k2-lid"></i><b class="k2-f"><span>Dashboard</span></b></span></div>
    <span class="k2-oldtag">Old way</span>
    <span class="k2-why" style="--x:2.3;--y:5.15">why?</span>
    <div class="k2-new"><i class="k2-shadow"></i><span class="k2-b" data-tone="data" style="--w:3;--h:1;--x:0;--y:0;--r:0"><i class="k2-lid"></i><b class="k2-f"><svg class="v7-ic" aria-hidden="true" focusable="false"><use href="#i-db"/></svg><span>Your data</span></b></span><span class="k2-b" data-tone="person" style="--w:2.3;--h:0.9;--x:0;--y:1;--r:0"><i class="k2-lid"></i><b class="k2-f"><svg class="v7-ic" aria-hidden="true" focusable="false"><use href="#i-person"/></svg><span>Person</span></b></span><span class="k2-b" data-tone="flow" style="--w:2.3;--h:0.9;--x:0;--y:1.9;--r:0"><i class="k2-lid"></i><b class="k2-f"><svg class="v7-ic" aria-hidden="true" focusable="false"><use href="#i-flow"/></svg><span>Flow</span></b></span><span class="k2-b" data-tone="flow" style="--w:2.3;--h:0.9;--x:0;--y:2.8;--r:0"><i class="k2-lid"></i><b class="k2-f"><svg class="v7-ic" aria-hidden="true" focusable="false"><use href="#i-flow"/></svg><span>Flow</span></b></span><span class="k2-b" data-tone="goal" data-goal style="--w:2.3;--h:1.05;--x:0;--y:3.7;--r:0"><i class="k2-lid"></i><b class="k2-f"><span>90%</span></b></span></div>
    <span class="k2-tag" style="--x:-1.37;--y:4.225">Goal</span>
    <span class="k2-ok" style="--x:1.37;--y:4.225"><i><svg class="v7-ic" aria-hidden="true" focusable="false"><use href="#i-check"/></svg></i>On track</span>
  </div>
  <figcaption class="sr-only">Animation of two block towers. Old way: build to replace a flow. Blocks labelled CRM, App, Bot, Excel and Dashboard are stacked with no target; the tower wobbles, someone asks why, and it falls into a pile. Our way: build to achieve a business goal. A goal block of 90% appears first, high up. Then the tower is built downward beneath it: two Flow blocks, a Person block and Your data at the base. When the base touches the ground the tower stands straight, and the goal shows On track.</figcaption>
  <button class="v7-pause" type="button" aria-label="Pause animation"><svg class="v7-ic" aria-hidden="true" focusable="false"><use href="#i-pause"/></svg></button>
</figure>
