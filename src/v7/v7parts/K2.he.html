  <figcaption class="sr-only">אנימציה של שני מגדלי קוביות. הדרך הישנה: בונים קודם. קוביות בשם CRM, אפליקציה, בוט, אקסל ודשבורד נערמות בלי יעד; המגדל מתנדנד, מישהו שואל למה, והוא קורס לערימה. הדרך שלנו: מתחילים מהמספר. קודם מופיעה למעלה קוביית יעד של 90%. אחר כך המגדל נבנה כלפי מטה מתחתיה: שתי קוביות תהליך, קוביית אדם, ובבסיס הנתונים שלכם. כשהבסיס נוגע בקרקע המגדל עומד ישר, והיעד מסומן כמתוכנן.</figcaption>
