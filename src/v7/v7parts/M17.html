<!-- M17 phone Q&A (Industries spec §3 M17). Reuses M7's phone look (.m-phone-* classes; M7.css must be loaded, it is in
     the assembled v7.css). Data-driven timing, all in ms from the start of a run:
       root data-v7-run (one run's length) and data-v7-runs (runs per controller cycle, = the spec's maxLoops);
       each beat in .m-phone-msgs carries data-v7-at; a Mate beat may carry data-v7-think (typing shown that long first);
       a child with data-v7-pop pops that long after its beat; a .m-ask-card row with data-v7-at checks at that time.
     Markup is the final state. -->
<figure class="v7-figure m-ask-fig">
  <div class="v7-mock m-ask" data-v7-mock="M17" data-v7-play="loop" data-v7-run="8800" data-v7-runs="2" aria-hidden="true" inert>
    <span class="v7-preview-tag m-ask-tag">Product preview</span>
    <div class="m-phone m-ask-phone">
      <div class="m-phone-screen">
        <div class="m-phone-status"><span class="m-phone-clock">09:14</span><span class="m-phone-sys"><svg class="m-phone-sig" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx=".8"/><rect x="4.5" y="4.8" width="3" height="6.2" rx=".8"/><rect x="9" y="2.4" width="3" height="8.6" rx=".8"/><rect x="13.5" y="0" width="3" height="11" rx=".8"/></svg><svg class="m-phone-wifi" viewBox="0 0 16 11.5"><path d="M8 11.5 5.4 8.9a3.7 3.7 0 0 1 5.2 0z"/><path d="M2.7 6.2a7.6 7.6 0 0 1 10.6 0l-1.5 1.5a5.5 5.5 0 0 0-7.6 0z"/><path d="M0 3.4a11.4 11.4 0 0 1 16 0l-1.5 1.5a9.3 9.3 0 0 0-13 0z"/></svg><svg class="m-phone-bat" viewBox="0 0 25 12"><rect class="m-phone-bat-o" x=".5" y=".5" width="21" height="11" rx="3.2"/><rect x="2" y="2" width="15" height="8" rx="1.7"/><path class="m-phone-bat-n" d="M23 4.2v3.6a1.9 1.9 0 0 0 0-3.6z"/></svg></span></div>
        <div class="m-phone-head">
          <svg class="v7-ic m-phone-back"><use href="#i-chevron"/></svg>
          <span class="v7-avatar is-mate m-phone-av"><svg class="v7-mark" viewBox="43 43 114 114"><use href="#i-mark"/></svg></span>
          <span class="m-phone-who"><b>Mate</b><small>via WhatsApp · Your company</small></span>
        </div>
        <div class="m-phone-body">
          <div class="m-phone-msgs">
            <span class="m-phone-date">Yesterday</span>
            <div class="m-phone-msg is-you m-phone-old"><div class="m-phone-b">List price on <bdi>SKU-2210</bdi>?<span class="m-phone-meta">10:12<span class="m-phone-ticks is-read"><svg class="v7-ic"><use href="#i-check"/></svg><svg class="v7-ic"><use href="#i-check"/></svg></span></span></div></div>
            <div class="m-phone-msg is-mate m-phone-old"><div class="m-phone-b"><bdi>$65.00</bdi> a case.<span class="m-phone-meta">10:12</span></div></div>
            <div class="m-phone-msg is-you m-phone-old"><div class="m-phone-b">Did <bdi>Q-1036</bdi> go out?<span class="m-phone-meta">11:20<span class="m-phone-ticks is-read"><svg class="v7-ic"><use href="#i-check"/></svg><svg class="v7-ic"><use href="#i-check"/></svg></span></span></div></div>
            <div class="m-phone-msg is-mate m-phone-old"><div class="m-phone-b">Yes. Approved and sent at <bdi>11:04</bdi>.<span class="m-phone-meta">11:20</span></div></div>
            <div class="m-phone-msg is-you m-phone-old"><div class="m-phone-b">Does <bdi>SKU-2214</bdi> replace <bdi>SKU-2210</bdi>?<span class="m-phone-meta">15:42<span class="m-phone-ticks is-read"><svg class="v7-ic"><use href="#i-check"/></svg><svg class="v7-ic"><use href="#i-check"/></svg></span></span></div></div>
            <div class="m-phone-msg is-mate m-phone-old"><div class="m-phone-b">Yes, same gloves. 85 in stock.<span class="m-phone-meta">15:42</span></div></div>
            <div class="m-phone-msg is-you m-phone-old"><div class="m-phone-b">Stock on <bdi>SKU-2210</bdi>?<span class="m-phone-meta">16:05<span class="m-phone-ticks is-read"><svg class="v7-ic"><use href="#i-check"/></svg><svg class="v7-ic"><use href="#i-check"/></svg></span></span></div></div>
            <div class="m-phone-msg is-mate m-phone-old"><div class="m-phone-b">340 cases, Central WH.<span class="m-phone-meta">16:05</span></div></div>
            <span class="m-phone-date">Today</span>
            <div class="m-phone-msg is-you" data-v7-at="400"><div class="m-phone-b">Store <bdi>#212</bdi> wants 12% on <bdi>SKU-1187</bdi>. Can I?<span class="m-phone-meta">09:12<span class="m-phone-ticks is-read"><svg class="v7-ic"><use href="#i-check"/></svg><svg class="v7-ic"><use href="#i-check"/></svg></span></span></div></div>
            <div class="m-phone-msg is-mate m-ask-col" data-v7-at="1600" data-v7-think="600"><div class="m-phone-b">Max is 10% (<bdi>R-01</bdi>). Their last order got 8%. 1,200 in stock, North WH.<span class="m-phone-meta">09:12</span></div><span class="m-ask-src" data-v7-pop="450"><svg class="v7-ic"><use href="#i-db"/></svg><span>ERP · read-only</span><span class="m-ask-sep"> · </span><span>Confidence: high</span></span></div>
            <div class="m-phone-msg is-you" data-v7-at="3700"><div class="m-phone-b">OK, 10%. Send the quote.<span class="m-phone-meta">09:13<span class="m-phone-ticks is-read"><svg class="v7-ic"><use href="#i-check"/></svg><svg class="v7-ic"><use href="#i-check"/></svg></span></span></div></div>
            <div class="m-phone-msg is-mate" data-v7-at="4900" data-v7-think="600"><div class="m-phone-b">Quote <bdi>Q-1077</bdi> drafted. Yossi M. approves before it goes out.<span class="m-phone-meta">09:13</span></div></div>
            <div class="m-ask-sysrow" data-v7-at="6400"><span class="m-ask-sys"><svg class="v7-ic"><use href="#i-check"/></svg>Yossi M. approved · <bdi>09:14</bdi></span></div>
            <div class="m-phone-msg is-mate m-ask-typing" data-v7-gone><div class="m-phone-b"><span class="v7-thinking"><i></i><i></i><i></i></span></div></div>
          </div>
        </div>
        <div class="m-phone-input"><span class="m-phone-field">Message</span><svg class="v7-ic"><use href="#i-send"/></svg></div>
      </div>
    </div>
    <div class="v7-card m-ask-card">
      <p class="m-ask-ctitle"><svg class="v7-ic"><use href="#i-search"/></svg>Mate checked</p>
      <ul class="m-ask-rows">
        <li class="m-ask-cr" data-v7-at="1060"><svg class="v7-ic"><use href="#i-db"/></svg><span>Price list · ERP, read-only</span><svg class="v7-ic m-ask-ok"><use href="#i-check"/></svg></li>
        <li class="m-ask-cr" data-v7-at="1200"><svg class="v7-ic"><use href="#i-rules"/></svg><span><bdi>R-01</bdi> · max 10% off</span><svg class="v7-ic m-ask-ok"><use href="#i-check"/></svg></li>
        <li class="m-ask-cr" data-v7-at="1340"><svg class="v7-ic"><use href="#i-audit"/></svg><span>Store <bdi>#212</bdi> · last order 8%</span><svg class="v7-ic m-ask-ok"><use href="#i-check"/></svg></li>
        <li class="m-ask-cr" data-v7-at="1480"><svg class="v7-ic"><use href="#i-db"/></svg><span>Stock · North WH · 1,200</span><svg class="v7-ic m-ask-ok"><use href="#i-check"/></svg></li>
      </ul>
    </div>
  </div>
  <button class="v7-pause" type="button" aria-label="Pause animation"><svg class="v7-ic" aria-hidden="true" focusable="false"><use href="#i-pause"/></svg></button>
  <figcaption class="sr-only">Product preview: a sales rep asks Mate on WhatsApp whether store #212 can get 12% off SKU-1187. Mate checks the ERP, read-only, and answers with high confidence: the maximum is 10% under rule R-01, the store’s last order got 8%, and 1,200 are in stock at the North warehouse. The rep settles on 10% and asks for the quote. Mate drafts quote Q-1077, and Yossi M. approves it at 09:14 before it goes out.</figcaption>
</figure>
